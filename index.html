<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>墾丁拍攝行程</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#080b10;--panel:#0f141b;--gold:#f0b957;--gold2:#ffd37a;--blue:#65a9ff;--blue2:#8bc0ff;--text:#f5f7fb;--muted:#9ca5b3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0f,#0b1117 45%,#090d12);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:820px;margin:auto;padding-bottom:105px}
.hero{min-height:370px;position:relative;background:linear-gradient(180deg,rgba(2,5,9,.1),rgba(8,11,16,.92)),url('hero.jpg') center/cover}.hero-inner{min-height:370px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:25px 22px 34px;text-align:center}.hero-top{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between}.round{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(8,11,16,.7);color:white;font-size:25px}.hero h1{font-family:"DFKai-SB","STKaiti",serif;font-size:48px;letter-spacing:.08em;margin:0 0 14px;text-shadow:0 4px 16px #000}.date{font-family:Georgia,serif;font-size:52px;margin-bottom:18px}.d1{color:#e9b85e}.d2{color:#7ab4ff}.loc{background:rgba(8,11,16,.62);border:1px solid rgba(255,255,255,.12);padding:10px 15px;border-radius:999px;font-size:14px}
.content{padding:0 24px 18px;margin-top:-12px;position:relative;z-index:2}.day{border:1px solid var(--gold);border-radius:26px;background:rgba(12,16,22,.98);margin-bottom:18px;overflow:hidden}.day.blue{border-color:var(--blue)}.day>summary{list-style:none;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(240,185,87,.45)}.day.blue>summary{border-bottom-color:rgba(101,169,255,.45)}.day>summary::-webkit-details-marker{display:none}.day-date strong{font-family:Georgia,serif;font-size:36px;color:var(--gold2);font-weight:500}.blue .day-date strong{color:var(--blue2)}.expand{border:1px solid currentColor;color:var(--gold2);padding:8px 14px;border-radius:999px}.blue .expand{color:var(--blue2)}
.events{padding:0 20px 14px 24px}.event{display:grid;grid-template-columns:42px 92px 1fr auto;gap:10px;align-items:center;min-height:74px;border-bottom:1px solid rgba(255,255,255,.08)}.timeline{height:100%;position:relative;display:flex;align-items:center;justify-content:center}.timeline:after{content:"";position:absolute;top:0;bottom:0;width:2px;background:rgba(240,185,87,.6)}.blue .timeline:after{background:rgba(101,169,255,.6)}.dot{width:17px;height:17px;border-radius:50%;background:var(--gold2);z-index:1}.blue .dot{background:var(--blue)}.time{font-size:20px;font-weight:700}.info{display:flex;gap:10px}.ico{font-size:22px;width:28px}.title{font-size:16px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;align-items:center;gap:12px}.nav{border:1px solid var(--gold);color:var(--gold2);text-decoration:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800}.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--gold2);background:transparent}.check.done{background:var(--gold2)}.blue .check{border-color:var(--blue2)}.blue .check.done{background:var(--blue2)}
.progress{margin:8px 2px 0;border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.pl{font-size:12px;color:var(--gold2)}.blue .pl{color:var(--blue2)}.track{height:9px;background:#21262d;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}.blue .fill{background:linear-gradient(90deg,#408eea,var(--blue2))}
.more{padding:2px 24px 22px}.more-title{text-align:center;color:var(--gold2);font-size:20px;margin:8px 0 14px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tool{border-radius:20px;padding:16px 10px;min-height:170px;color:#fff;border:1px solid rgba(255,255,255,.16);background:#151922;text-align:center}.tool .ti{font-size:34px;margin-bottom:12px}.tool b{display:block;font-size:15px}.tool small{display:block;color:#aaa;margin:6px 0 12px;font-size:11px}.pink{background:linear-gradient(180deg,rgba(90,43,54,.62),#17191f)}.green{background:linear-gradient(180deg,rgba(39,74,46,.6),#17191f)}.purple{background:linear-gradient(180deg,rgba(56,43,82,.62),#17191f)}.orange{background:linear-gradient(180deg,rgba(87,57,31,.6),#17191f)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,13,18,.97);border-top:1px solid #303640;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:none;color:#9ba3b3;font-size:11px}.bottom span{display:block;font-size:24px}.active{color:var(--gold2)!important}.camera{width:56px;height:56px;border-radius:50%;margin:-28px auto 0!important;background:linear-gradient(#ffd978,#d99c37)!important;color:#111!important}
dialog{width:min(92vw,560px);max-height:84vh;border:1px solid #333a45;border-radius:24px;background:#12171e;color:#fff;padding:0}.modal{padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#242a33;color:#fff;border-radius:12px;padding:8px 10px}.row{display:flex;gap:10px;background:#1b2129;border-radius:14px;padding:11px;margin-bottom:7px}.tip{background:#1b2129;border-radius:14px;padding:12px;margin-bottom:8px}.tip p{color:var(--muted);font-size:13px}.quicknav a{display:block;color:#fff;text-decoration:none;background:#1b2129;border-radius:14px;padding:13px;margin-bottom:8px}textarea{width:100%;min-height:180px;background:#1b2129;color:white;border:1px solid #303844;border-radius:14px;padding:12px}.save{margin-top:9px;border:0;border-radius:12px;background:var(--gold2);padding:10px 13px;font-weight:900}
@media(max-width:650px){.hero h1{font-size:38px}.date{font-size:42px}.content,.more{padding-left:14px;padding-right:14px}.event{grid-template-columns:30px 76px 1fr auto;gap:8px}.title{font-size:14px}.time{font-size:17px}.nav{padding:7px 10px}.tools{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<section class="hero"><div class="hero-top"><button class="round">☰</button><button class="round">☀︎</button></div><div class="hero-inner"><h1>墾丁拍攝行程</h1><div class="date"><span class="d1">10/17</span> ～ <span class="d2">10/18</span></div><div class="loc">📍 墾丁・陽光・海景・婚紗拍攝</div></div></section>
<section class="content">
<details class="day" open><summary><div class="day-date"><strong>10/17</strong>（五）</div><div class="expand">展開⌄</div></summary><div class="events" id="day1"></div><div class="progress"><div class="pl" id="l1"></div><div class="track"><div class="fill" id="f1"></div></div><div id="p1"></div></div></details>
<details class="day blue" open><summary><div class="day-date"><strong>10/18</strong>（六）</div><div class="expand">展開⌄</div></summary><div class="events" id="day2"></div><div class="progress"><div class="pl" id="l2"></div><div class="track"><div class="fill" id="f2"></div></div><div id="p2"></div></div></details>
</section>
<section class="more"><div class="more-title">✦ 更多功能 ✦</div><div class="tools">
<button class="tool pink" onclick="openM('carry')"><div class="ti">🧳</div><b>婚紗攜帶清單</b><small>可勾選確認</small></button>
<button class="tool green" onclick="openM('tips')"><div class="ti">📷</div><b>拍攝提醒</b><small>注意事項 & 小提醒</small></button>
<button class="tool purple" onclick="openM('nav')"><div class="ti">📍</div><b>快速導航</b><small>常用地點一鍵導航</small></button>
<button class="tool orange" onclick="openM('notes')"><div class="ti">📒</div><b>臨時備忘錄</b><small>記錄想法 & 重要事項</small></button>
</div></section></div>
<nav class="bottom"><button class="active"><span>🏠</span>行程</button><button><span>🗓️</span>行程總覽</button><button class="camera"><span>📷</span></button><button onclick="openM('carry')"><span>☑️</span>清單</button><button onclick="openM('notes')"><span>👤</span>我的</button></nav>
<dialog id="carry"><div class="modal"><div class="head"><h3>🧳 婚紗攜帶清單</h3><button class="close" onclick="carry.close()">✕</button></div><div id="carryList"></div></div></dialog>
<dialog id="tips"><div class="modal"><div class="head"><h3>📷 拍攝提醒</h3><button class="close" onclick="tips.close()">✕</button></div><div class="tip"><b>前一天</b><p>確認白紗、黑紗、輕寫真服裝與配件，手機與行動電源充飽並提早休息。</p></div><div class="tip"><b>海邊拍攝</b><p>準備拖鞋、毛巾、防曬、防蚊與飲水。</p></div><div class="tip"><b>黑紗</b><p>18:00 後光線變化快，預留換裝與移動時間。</p></div></div></dialog>
<dialog id="nav"><div class="modal"><div class="head"><h3>📍 快速導航</h3><button class="close" onclick="nav.close()">✕</button></div><div class="quicknav"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=%E8%BD%9F%E7%A8%BB%E6%A9%9F%20Hometown%20%E6%81%86%E6%98%A5">🍽️ 轟稻機 Hometown 午餐 →</a><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=%E6%97%A5%E6%97%A5%E6%97%85%E6%B5%B7%20%E5%B1%8F%E6%9D%B1%E7%B8%A3%E6%BB%BF%E5%B7%9E%E9%84%89%E8%88%88%E6%B5%B7%E8%B7%AF33%E8%99%9F">🏡 日日旅海 →</a></div></div></dialog>
<dialog id="notes"><div class="modal"><div class="head"><h3>📒 臨時備忘錄</h3><button class="close" onclick="notes.close()">✕</button></div><textarea id="memo"></textarea><button class="save" onclick="saveMemo()">儲存備忘</button></div></dialog>
<script>
const ML="https://www.google.com/maps/search/?api=1&query=%E8%BD%9F%E7%A8%BB%E6%A9%9F%20Hometown%20%E6%81%86%E6%98%A5",MS="https://www.google.com/maps/search/?api=1&query=%E6%97%A5%E6%97%A5%E6%97%85%E6%B5%B7%20%E5%B1%8F%E6%9D%B1%E7%B8%A3%E6%BB%BF%E5%B7%9E%E9%84%89%E8%88%88%E6%B5%B7%E8%B7%AF33%E8%99%9F";
const D={day1:[["07:00","💄","化妝"],["09:00","🚙","出發"],["13:00","🍴","轟稻機 Hometown 午餐","恆春鎮",ML],["約14:00","📷","日日旅海民宿拍攝","屏東縣滿州鄉興海路 33 號",MS],["15:00","👗","入住、換白紗拍攝（室內 & 海邊）"],["18:00後","✨","拍攝黑紗"]],day2:[["06:00","💄","化妝"],["07:00","📷","拍攝輕寫真"],["08:00－09:00","🍴","各自用餐"]]};
let S=JSON.parse(localStorage.getItem("kd")||"{}");
function draw(id){let r=document.getElementById(id);r.innerHTML="";D[id].forEach((x,i)=>{let k=id+i,e=document.createElement("div");e.className="event";e.innerHTML=`<div class="timeline"><div class="dot"></div></div><div class="time">${x[0]}</div><div class="info"><div class="ico">${x[1]}</div><div><div class="title">${x[2]}</div>${x[3]?`<div class="sub">📍 ${x[3]}</div>`:""}</div></div><div class="actions">${x[4]?`<a class="nav" target="_blank" href="${x[4]}">📍 導航</a>`:""}<button class="check ${S[k]?"done":""}" onclick="tog('${k}')">${S[k]?"✓":""}</button></div>`;r.appendChild(e)});prog(id)}
function tog(k){S[k]=!S[k];localStorage.setItem("kd",JSON.stringify(S));draw("day1");draw("day2")}
function prog(id){let n=D[id].filter((_,i)=>S[id+i]).length,t=D[id].length,j=id=="day1"?"1":"2",p=Math.round(n/t*100);document.getElementById("l"+j).textContent=`今日進度 ${n} / ${t}`;document.getElementById("f"+j).style.width=p+"%";document.getElementById("p"+j).textContent=p+"%"}
function openM(id){document.getElementById(id).showModal()}
const C=["白紗、黑紗、輕寫真服裝","婚鞋＋拖鞋／便鞋","隱形內衣／胸貼／無痕內著","男生西裝／襯衫／皮鞋／皮帶／襪子","耳環、項鍊、頭飾、戒指","補妝品、吸油面紙、唇彩","防曬、防蚊、飲用水","毛巾、濕紙巾、衛生紙","髮夾、橡皮筋、安全別針、雙面膠","手機、行動電源、充電線","相機、電池、記憶卡、充電器","透明雨傘／輕便雨具","捧花或想入鏡的小道具"],CS=JSON.parse(localStorage.getItem("kc")||"{}"),CL=document.getElementById("carryList");C.forEach((x,i)=>{let r=document.createElement("div");r.className="row";r.innerHTML=`<input type="checkbox" ${CS[i]?"checked":""}><label>${x}</label>`;r.querySelector("input").onchange=e=>{CS[i]=e.target.checked;localStorage.setItem("kc",JSON.stringify(CS))};CL.appendChild(r)});
memo.value=localStorage.getItem("km")||"";function saveMemo(){localStorage.setItem("km",memo.value);alert("備忘已儲存 ✓")}draw("day1");draw("day2");
</script></body></html>
